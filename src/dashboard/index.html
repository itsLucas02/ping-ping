<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://127.0.0.1:19999 http://localhost:19999"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ping-ping — Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="brand-icon" aria-hidden="true">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          <div class="brand-meta">
            <h1 class="title">ping-ping</h1>
            <span class="subtitle">AI Notification Relay</span>
          </div>
        </div>
        <div class="header-right">
          <button class="btn subtle" id="markAllReadBtn" hidden>
            Mark all read
          </button>
          <span class="status-pill" id="statusPill">
            <span class="status-dot" id="statusDot" title="Server status"></span>
            <span class="status-label" id="statusLabel">Connecting…</span>
          </span>
          <button
            class="btn subtle icon-only"
            id="themeToggleBtn"
            title="Toggle theme (Light / Dark)"
            aria-label="Toggle theme"
          >
            <svg id="themeIconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="themeIconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
          <button
            class="btn subtle"
            id="settingsBtn"
            aria-expanded="false"
            aria-controls="settingsPanel"
            title="Settings"
          >
            Settings
          </button>
          <button class="btn subtle danger" id="clearBtn" title="Clear all notifications">
            Clear
          </button>
        </div>
      </header>

      <!-- Settings panel -->
      <section class="settings-panel" id="settingsPanel" hidden aria-label="Settings">
        <div class="settings-inner">
          <label class="setting-row">
            <input type="checkbox" id="soundToggle" />
            <span>Play sound with notifications</span>
          </label>
          <label class="setting-row">
            <input type="checkbox" id="launchToggle" />
            <span>Launch ping-ping at login</span>
          </label>
          <div class="setting-actions">
            <button class="btn primary" id="testPingBtn">Send test ping</button>
            <button class="btn subtle" id="restartBtn" title="Restart the ping-ping server">
              ↺ Restart server
            </button>
          </div>
          <p class="connection-info" id="connectionInfo"></p>
        </div>
      </section>

      <!-- Toolbar: filters + search -->
      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
        <div class="toolbar-right">
          <span class="count-label" id="countLabel"></span>
          <input
            type="search"
            id="searchInput"
            placeholder="Search pings…"
            aria-label="Search notifications"
          />
        </div>
      </div>

      <!-- Notification list -->
      <main class="notification-list" id="notificationList" role="log" aria-live="polite">
        <!-- Empty state: first run -->
        <div class="empty-state" id="emptyTeach">
          <div class="empty-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          <p class="empty-title">No pings yet</p>
          <p class="empty-sub">When your agents ping you, they'll show up here.</p>
          <details class="empty-details">
            <summary>How to send the first ping</summary>
            <div class="snippet-wrap">
              <code class="empty-code" id="emptySnippet"></code>
              <button class="btn subtle" id="copySnippetBtn">Copy</button>
            </div>
            <div class="empty-actions">
              <button class="btn subtle" id="testPingEmptyBtn">Send test ping</button>
            </div>
          </details>
        </div>
        <!-- Empty state: filters matched nothing -->
        <div class="empty-state" id="emptyFiltered" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <p class="empty-title">Nothing matches</p>
          <p class="empty-sub">Try a different filter or search term.</p>
        </div>
      </main>

      <!-- Keyboard hints -->
      <footer class="hints" aria-hidden="true">
        <span><kbd>/</kbd> search</span>
        <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span><kbd>C</kbd> copy</span>
        <span><kbd>Del</kbd> delete</span>
        <span><kbd>Esc</kbd> close</span>
      </footer>
    </div>

    <!-- Toasts -->
    <div class="toast-region" id="toastRegion" role="status"></div>

    <script src="app.js"></script>
  </body>
</html>
